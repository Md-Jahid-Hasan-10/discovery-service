server:
    port: 8761

spring:
    application:
        name: discovery-service

eureka:
    instance:
        hostname: localhost
    client:
# This server is the registry itself, so it must not register with or fetch from itself.
        register-with-eureka: false
        fetch-registry: false
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    server:
# Local development only: removes stopped services from the dashboard quickly.
        enable-self-preservation: false
        eviction-interval-timer-in-ms: 5000

management:
  server:
# The other services publish their metrics on 18080-18090. Prometheus runs in
# a container and scrapes them through host.docker.internal, so the metrics
# port has to be reachable from outside the loopback interface.
    port: ${MANAGEMENT_PORT:18761}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
